<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>__TITLE__</title>
<style>
:root{--bg:#eef1f4;--panel:#ffffffee;--ink:#1d2730;--muted:#5d6b78;--accent:#1f8a5b;--line:#d5dbe1;--lab:#ffffff;--labink:#1d2730}
@media (prefers-color-scheme:dark){:root{--bg:#151a1f;--panel:#1f262dee;--ink:#e7edf2;--muted:#9aa8b5;--accent:#3ccf8e;--line:#34404b;--lab:#232b33;--labink:#e7edf2}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#labels{position:fixed;inset:0;pointer-events:none}
.lab{position:absolute;transform:translate(-50%,-100%);white-space:nowrap;background:var(--lab);color:var(--labink);border:1px solid var(--line);border-radius:6px;padding:2px 7px;font-size:12px;font-weight:600;box-shadow:0 1px 4px #0002}
.lab::after{content:"";position:absolute;left:50%;top:100%;width:1px;height:14px;background:var(--muted)}
.lab b{color:var(--accent);margin-right:4px}
.lab.hl{outline:2px solid var(--accent)}
#panel{position:fixed;left:16px;top:16px;width:300px;max-width:calc(100vw - 32px);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;backdrop-filter:blur(6px)}
#panel h1{font-size:16px;margin:0 0 2px}
ol li span{color:var(--ink);font-weight:600}
#panel .sub{color:var(--muted);font-size:12px;margin-bottom:8px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:6px 0}
button{font:inherit;font-size:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:7px;padding:4px 9px;cursor:pointer}
button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent)}
#status{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-weight:600;max-width:calc(100vw - 32px);text-align:center}
#status small{display:block;color:var(--muted);font-weight:400}
ol{margin:6px 0 0;padding-left:20px;font-size:12px;color:var(--muted)}
ol li{cursor:pointer}
ol li:hover{color:var(--ink)}
#toggle{display:none}
@media (max-width:640px){#panel{top:auto;bottom:80px;width:auto;right:16px;max-height:40vh;overflow:auto}#parts{display:none}}
body.shot #panel{display:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="labels"></div>
<div id="panel">
  <h1 id="title"></h1>
  <div class="sub">Drag to rotate, scroll to zoom, right-drag to pan. Sizes in mm.</div>
  <div class="row" id="extra">
    <button id="play" class="on">Pause</button>
    <button id="speed">Speed 1x</button>
  </div>
  <input id="t" type="range" min="0" max="10" step="0.01" value="0">
  <div class="row">
    <span style="color:var(--muted);font-size:12px">Walls</span>
    <button data-w="solid">Solid</button><button data-w="glass" class="on">See-through</button><button data-w="off">Hidden</button>
    <button id="lbl" class="on">Labels</button>
  </div>
  <ol id="parts"></ol>
</div>
<div id="status">Ready<small></small></div>
<script>/*THREE*/</script>
<script>/*ORBIT*/</script>
<script>/*STL*/</script>
<script>/*GLTF*/</script>
<script>/*LIB*/</script>
<script>/*SCENE*/</script>
</body>
</html>
